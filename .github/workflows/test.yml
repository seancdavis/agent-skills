name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test skills/pr-watch/scripts/watch-pr.test.mjs skills/visual-qa/scripts/config.test.mjs skills/visual-qa/scripts/gate.test.mjs skills/visual-qa/scripts/capture.test.mjs
